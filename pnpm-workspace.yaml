packages:
  - server

overrides:
  normalize-package-data>resolve: 1.22.1
  # React 18 と MUI v7 併用時の react-is バージョン不整合を防ぐ
  react-is: "$react"

# 公開から 7 日経過したバージョンのみ解決する（分単位: 7 * 24 * 60）
minimumReleaseAge: 10080

allowBuilds:
  "@nestjs/core": true
  "@openapitools/openapi-generator-cli": true
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": true
  core-js-pure: true
  cpu-features: true
  esbuild: true
  prisma: true
  sharp: true
  ssh2: true
  unrs-resolver: true
