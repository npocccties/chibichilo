# NOTE: DON'T USE IT IN PRODUCTION. 本番環境で使用しないで。
services:
  mariadb:
    image: "mariadb:11.4.13-noble"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: moodle
    volumes:
      - mariadb_data_v11:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  moodle:
    image: ghcr.io/npocccties/chibichilo-moodle
    build: moodle
    ports: ["8081:80"]
    environment:
      MOODLE_WWWROOT: "http://localhost:8081"
      MOODLE_USERNAME: user
      MOODLE_PASSWORD: password
      MOODLE_DB_HOST: mariadb
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: root
      MOODLE_DB_PASS: ""
      PHP_INI-max_input_vars: "5000"
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - moodle_html_phpapache_v1:/var/www/html
      - moodledata_phpapache_v1:/var/www/moodledata
  db:
    image: "postgres:17.2-alpine3.21"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports: ["5432:5432"]
    volumes:
      - postgres_data_v17:/var/lib/postgresql/data
  app:
    image: "node:26.2.0"
    environment:
      HOME: /tmp
      FRONTEND_ORIGIN: "http://localhost:3000"
      SESSION_SECRET: super_secret_characters_for_session
      OAUTH_CONSUMER_KEY: test
      OAUTH_CONSUMER_SECRET: test
      DATABASE_URL: postgresql://postgres:password@db/postgres
    user: ${UID:-1000}:${GID:-1000}
    command:
      - sh
      - -c
      - |
        npm install -g pnpm@11.1.2 --prefix "$$HOME/.local"
        export PATH="$$HOME/.local/bin:$$PATH"
        cd /app && pnpm install && pnpm dev
    volumes: ["./:/app"]
    ports:
      - "3000:3000"
      - "5555:5555"
      - "8080:8080"
    depends_on: [moodle, db]
volumes:
  mariadb_data_v11:
  moodle_html_phpapache_v1:
  moodledata_phpapache_v1:
  postgres_data_v17:
